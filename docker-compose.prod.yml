# Production stack. Shipped to the VPS by .github/workflows/ci.yml alongside a
# rendered .env, and never used locally except to rehearse a deploy.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# This is a SEPARATE FILE, not an overlay on docker-compose.yml. The dev file
# publishes Postgres and Redis on the host so `npm run dev` can reach them; here
# nothing but Caddy is reachable from outside, and an overlay cannot un-publish a
# port its base declared.

name: oxshare

# Docker's default json-file driver has no bound, so a chatty container fills the
# VPS disk and takes the database down with it. Applied to every service.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

# The API, shared by its two colours below.
x-api: &api
  restart: unless-stopped
  init: true
  # SIGTERM drains (main.ts enableShutdownHooks): in-flight requests finish.
  stop_grace_period: 30s
  env_file:
    - .env
  volumes:
    - oxshare_uploads:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  <<: *logging

services:
  # THE SERVICE NAME `postgres` IS LOad-BEARING — do not rename it.
  # src/database/db.ts treats /@(localhost|127\.0\.0\.1|postgres)[:/]/ as a local
  # connection and disables TLS for it. Every other hostname gets
  # ssl: { rejectUnauthorized: true }, so renaming this to `db` makes the API
  # demand a certificate from a container that has none, and it fails at boot
  # while `scripts/migrate.mjs` keeps working — a split that is genuinely hard to
  # read from the symptoms.
  postgres:
    image: postgres:16-alpine
    container_name: oxshare_postgres
    restart: unless-stopped
    # Docker gives a container 64MB of /dev/shm, and Postgres puts parallel-query
    # workers and parallel index builds there. Running out answers a 500 under load
    # or, during a `pg_restore -j`, silently skips indexes ("errors ignored on
    # restore") while every row looks fine. A ceiling, not a reservation: tmpfs uses
    # RAM only as it is written. Keep it above maintenance_work_mem × parallel
    # maintenance workers (256MB × 2 below). SERVER-CONCEPTS §7a.
    shm_size: 1g
    # Sized for the 8 GB backend server (Hostinger KVM 2), shared with the API and
    # Redis; the image's defaults (128MB shared_buffers) are sized for a laptop.
    # NVMe disk, hence the low random_page_cost and high effective_io_concurrency.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
    environment:
      POSTGRES_USER: oxshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: oxshare
    volumes:
      - oxshare_pgdata:/var/lib/postgresql/data
    # Not published to the host. `docker compose exec postgres psql -U oxshare`
    # for a shell; a database on a public interface is a different risk entirely.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oxshare -d oxshare']
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *logging

  # Replay markers for signed webhooks and the throttler's counters. Every key
  # here is meant to expire in minutes, so persisting them across a restart would
  # be worse than losing them — no volume, no appendonly, on purpose.
  redis:
    image: redis:7-alpine
    container_name: oxshare_redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    # redis:7-alpine ships NO healthcheck, and `condition: service_healthy`
    # against a service without one makes compose refuse to start api at all.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *logging

  # ── The API, as TWO services: zero-downtime releases (deploy/release.sh) ───
  #
  # A release starts the new version in the idle colour BESIDE the live one,
  # waits for its health check, switches Caddy to it (graceful reload), and only
  # then stops the old one, which finishes its in-flight requests. Which colour is
  # live, and each colour's image tag, live in release.env (release.sh writes it).
  # The profiles keep a bare `docker compose up -d` from starting either colour:
  # only release.sh starts the API.
  api_blue:
    <<: *api
    image: ${IMAGE_REPO:?IMAGE_REPO is required}:${BLUE_TAG:-unreleased}
    container_name: oxshare_api_blue
    profiles: [blue]

  api_green:
    <<: *api
    image: ${IMAGE_REPO:?IMAGE_REPO is required}:${GREEN_TAG:-unreleased}
    container_name: oxshare_api_green
    profiles: [green]

  caddy:
    image: caddy:2
    container_name: oxshare_caddy
    restart: unless-stopped
    # 443 on both TCP (h1/h2) and UDP (h3/QUIC). UDP/443 delivery was measured
    # end-to-end on 17 Aug 2026; if the host ever stops passing it, remove the
    # udp line AND pin `servers { protocols h1 h2 }` in the Caddyfile, together
    # — h3 advertised over a dead UDP path breaks mobile clients for the 30-day
    # alt-svc cache lifetime.
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
      # The bridge's door, bound to the WireGuard address ONLY (Caddyfile, last
      # block). wg0 must exist before Docker binds this, so the server carries a
      # systemd drop-in ordering docker.service after wg-quick@wg0 (DEPLOYMENT.md).
      - '10.8.0.1:8080:8080'
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Which API colour is live; written by release.sh before Caddy first starts.
      - ./active-api.caddy:/etc/caddy/active-api.caddy:ro
      # caddy_data HOLDS THE CERTIFICATES AND THE ACME ACCOUNT KEY. Deleting it
      # forces re-issuance, and Let's Encrypt rate-limits that per registered
      # domain per week — losing it twice in a week means no TLS until it resets.
      - caddy_data:/data
      - caddy_config:/config
    # No depends_on: Caddy must never wait for, or restart with, an API colour.
    <<: *logging

volumes:
  oxshare_pgdata:
  oxshare_uploads:
  caddy_data:
  caddy_config:
