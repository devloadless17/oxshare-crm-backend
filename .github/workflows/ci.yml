name: CI

# ARCHITECTURE §11: "Reconciliation test ... runs in CI on every commit."
# This workflow is that requirement. If the money path stops balancing, the
# build goes red before anyone reviews the diff.
#
# ── A push to `production` deploys (DEPLOY-PLAYBOOK §1) ──────────────────────
#
#   main / PRs to production → verify only, never touches a server
#   push to production       → verify → build (Docker Hub, :latest + :<sha>)
#                              → deploy to the backend server over SSH:
#                                migrate, `up -d`, health gate
#
# The backend server is Linux (Hostinger, Düsseldorf). It reaches the MT5 bridge,
# which stays alone on the Contabo Windows server, through a WireGuard tunnel:
# the bridge is http://10.8.0.2:5055 and answers nobody else.
#
# ── Minutes are a budget, so this runs when it can tell you something ────────
#
# This suite costs 6–9 minutes (Testcontainers starts a real Postgres), so the
# triggers skip runs that could not fail:
#
#  - `paths-ignore` — a markdown-only commit cannot break the money tests. One
#    docs change cost a full run for nothing, which is what prompted this.
#  - `pull_request` is scoped to PRs targeting `production`. Pushes to `main`
#    already run this workflow, so an unscoped trigger paid twice for the same
#    answer on every merge PR.
#
# To skip deliberately, put `[skip ci]` in the commit message — GitHub honours it
# natively, and `workflow_dispatch` below still works on a skipped commit, so
# nothing becomes unverifiable. Take care skipping a commit destined for
# production: `[skip ci]` on a production push skips the DEPLOY too, which is the
# point of skipping, and `workflow_dispatch` redeploys it when wanted.
on:
  # `production` runs the suite again before it deploys. A PR into production
  # already tested the merge result, so this costs ~10 Actions minutes per
  # release (the account was at 1,803 of 2,000 included minutes on 10 Sep 2026).
  # It is paid because `production` has no branch protection: a DIRECT push
  # (the "Release:" commits are direct pushes) would otherwise ship untested
  # code to a money system. `deploy` needs `verify`, so nothing ships red.
  push:
    branches: [main, production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  # A redeploy without an empty commit. Rolling back is `bash release.sh rollback`
  # in ~/oxshare-crm-backend on the server (the previous version is kept, and the
  # switch is the same zero-downtime one), or re-running this workflow on an
  # older commit.
  workflow_dispatch:

# Nothing here uses GITHUB_TOKEN — the registry and the VPS have their own
# credentials — so the token gets the least it can carry.
permissions:
  contents: read

# A superseded run describes a commit nobody is on any more, so cancelling it
# frees minutes for the run that replaced it. `production` is exempt: cancelling
# a deploy mid-ssh orphans containers on the server (DEPLOY-PLAYBOOK §1).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

# `DEPLOY_DIR` is on the deploy job, beside the only step that uses it.

jobs:
  verify:
    name: Type-check, lint and the §11 money tests
    # On production, skipped when `plan` found this code already verified on main.
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.verified != 'true' }}
    runs-on: ubuntu-latest

    # ── The two backing services the specs have always assumed ───────────────
    #
    # Testcontainers covers the money specs, which build and destroy their own
    # Postgres. It does NOT cover the specs that stand up the whole AppModule —
    # route-authorization, audit-coverage, client-scope-coverage, openapi-routes
    # — because `SelfServiceGroups.onModuleInit` reads trading products at boot,
    # so `app.init()` needs a real database on the default connection. On a dev
    # machine `docker compose up -d` supplies exactly that and the specs pass; a
    # runner had neither, so those four failed on every commit from 14 Aug.
    #
    # The credentials deliberately match the fallback in `src/database/db.ts`
    # (`oxshare:oxshare_dev@localhost:5432/oxshare`), so no DATABASE_URL is set
    # here and CI resolves the same connection a developer's machine does. That
    # host is also why TLS stays off: db.ts treats localhost as local.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxshare
          POSTGRES_PASSWORD: oxshare_dev
          POSTGRES_DB: oxshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxshare -d oxshare"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Single-use replay markers for signed webhooks. `ReplayNonceModule` turns
      # a missing Redis into a REFUSAL rather than a bypass — fail-closed, and
      # correct — so without this every signed Rival webhook spec got a 401 it
      # was right to get and the suite was wrong to provoke.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # ── Config the process REFUSES to boot without ───────────────────────────
    #
    # `env.validation.ts` rejects a missing or short JWT secret rather than
    # starting with a weak one, which is correct and is why the HTTP specs stand
    # up a real Nest app. It also means CI must supply them: locally they come
    # from a gitignored `.env`, so the suite passed on every machine and failed
    # here from the moment the fourth secret was added — for ten commits, with
    # nobody looking, which is the failure mode a green-by-default pipeline has.
    #
    # These are NOT secrets. They are fixed throwaway strings long enough to
    # satisfy the 32-character floor, used to sign tokens for a Postgres that
    # Testcontainers creates and destroys inside the job. Putting real values in
    # repository secrets would imply this build can reach something real; it
    # cannot, and pretending otherwise is how a test key ends up in production.
    env:
      ADMIN_JWT_SECRET: ci-only-admin-access-secret-not-a-real-key
      ADMIN_JWT_REFRESH_SECRET: ci-only-admin-refresh-secret-not-a-real-key
      JWT_ACCESS_SECRET: ci-only-portal-access-secret-not-a-real-key
      JWT_REFRESH_SECRET: ci-only-portal-refresh-secret-not-a-real-key
      # The local-filesystem storage driver. `STORAGE_DRIVER` defaults to `r2`,
      # and env.validation.ts then requires the R2 credential block, so a build
      # without this would fail to boot AppModule. Stated rather than inferred for
      # the reason that file gives: silently falling back to disk is how identity
      # documents end up somewhere non-durable with nothing reporting it. CI must
      # never hold real R2 credentials — same rule as the fake secrets above.
      STORAGE_DRIVER: disk
      # Points at the `redis` service above. Same reasoning as STORAGE_DRIVER:
      # stated, so a signed-webhook spec exercises the real nonce store instead
      # of the refusal path.
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The npm that interprets the lockfile is pinned, because Node 22 bundles
      # npm 10.9 and the lockfile is maintained under npm 11. npm 10's ideal-tree
      # builder mishandles a lockfile when package.json carries `overrides` —
      # it re-resolves nested ranges against the registry's latest instead of
      # honouring the locked version, so the day esbuild published 0.28.2 every
      # `npm ci` began refusing the committed lockfile with "Missing:
      # esbuild@0.28.2 from lock file", no commit involved. npm 11 honours the
      # lock. The Dockerfile pins the same version for the same reason.
      - name: Pin npm to the lockfile's generation
        run: npm install -g npm@11

      # `npm ci` works again: the dead "jest" config block and its ts-jest
      # dependency were removed (the repo runs Vitest) and the lockfile
      # regenerated. Reproducible installs matter most on the money repo.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PLATFORM-CONVENTIONS R-7.6. `--no-audit` above keeps the install quiet
      # and fast; auditing is a separate, FAILING step rather than a line of
      # install noise nobody reads. `high` and above only — a moderate advisory
      # in a dev-only transitive dependency must not be able to block a fix to
      # the money path.
      #
      # `--omit=dev` for the same reason, now that `deploy` needs this job: a HIGH
      # advisory in vitest or drizzle-kit would otherwise block every hotfix to
      # production, and neither is in the shipped image — the Dockerfile prunes
      # them out. This audits what actually runs.
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Type-check
        run: npx tsc --noEmit

      # Formatting is a gate, not a preference: the two frontends keep several
      # deliberately identical "twin" files, and unformatted code makes a real
      # behavioural diff between them impossible to spot.
      - name: Format check
        run: npm run format:check

      # No continue-on-error: this gate previously passed because no ESLint
      # config existed at all, which let a floating promise on an authorization
      # check reach main.
      - name: Lint
        run: npm run lint

      # The AppModule specs need SCHEMA, not merely a reachable server:
      # `SelfServiceGroups.onModuleInit` selects from trading_products, so an
      # empty database fails `app.init()` the same way an absent one does. The
      # same programmatic migrator the deploy uses, against the service above —
      # one migrator for CI and production rather than two that can disagree.
      # Testcontainers specs are untouched; they migrate their own database.
      - name: Apply migrations to the CI database
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: postgresql://oxshare:oxshare_dev@localhost:5432/oxshare

      # Testcontainers starts its own Postgres 16; the runner's Docker is all
      # it needs. Tests run against the real committed migrations, never a mock.
      # --coverage so the thresholds in vitest.config.mts actually bind. They are
      # floors pinned to measured numbers, not aspirations, and may only go up.
      - name: Money-path tests (§11 reconciliation, idempotency, concurrency, two-level)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # PLATFORM-CONVENTIONS R-1.3 — the API contract, checked rather than trusted.
      #
      # Both frontends generate their types from this document. Until it was
      # committed, nothing verified the generated types still matched: the
      # frontend pipelines type-check against their OWN committed types.gen.ts,
      # so a backend shape change with no regeneration left all three builds
      # green while the running system was broken. The admin workflow even
      # carried a comment claiming it caught that; it never runs the backend, so
      # it could not.
      - name: API contract is up to date
        run: node scripts/gen-openapi.mjs --check

  # ───────────────────────────────────────────────────────────────────────────
  # Everything below runs ONLY for `production`. `main` and pull requests stop
  # at `verify` and never touch the server.
  #
  # On a pull_request, github.ref is refs/pull/N/merge — so the branch check
  # alone would not be enough, which is why the event is checked too.
  # ───────────────────────────────────────────────────────────────────────────
  # ── Build once, promote: why a production push takes about 2 minutes ──────
  #
  # Every push to main builds the image IN PARALLEL with `verify`, tagged
  # `cand-<content key>`, and `promote` stamps it `tree-<content key>` only once
  # verify has passed. A push to production then re-runs nothing: `plan` finds the
  # verified image for exactly this code and `deploy` ships it. The content key
  # (.github/content-key.sh) hashes the code, not the commit, so a "Release:" merge
  # commit finds the image main built, and a docs-only change keeps the key.
  #
  # Code that never went through main (a direct hotfix on production) gets no such
  # image, so `plan` says so and this run verifies and builds it before deploying.
  # Either way, nothing ships that has not passed `verify`.
  plan:
    name: Find the verified image
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Reads main's CI run to wait for it (or stop when it failed). The workflow-wide
    # `contents: read` alone refuses that read, so a release pushed before main had
    # finished failed at once (6 Oct 2026); re-running after main finished worked.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 50
    outputs:
      key: ${{ steps.find.outputs.key }}
      verified: ${{ steps.find.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - id: find
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/oxshare-crm-backend
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          key=$(bash .github/content-key.sh HEAD)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          has() { docker manifest inspect "$IMAGE:tree-$key" >/dev/null 2>&1; }
          if has; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "Verified image found: $IMAGE:tree-$key. Deploying it."
            exit 0
          fi
          # Main's latest code IS this code: its pipeline is still verifying and
          # building it, so wait for it rather than redo it here.
          main_sha=$(git rev-parse origin/main)
          if [ "$(bash .github/content-key.sh origin/main)" != "$key" ]; then
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This code never passed through main: verifying and building it in this run."
            exit 0
          fi
          echo "Waiting for main's pipeline (${main_sha:0:7}) to verify and build this code..."
          for _ in $(seq 1 135); do
            if has; then echo "verified=true" >> "$GITHUB_OUTPUT"; echo "Verified."; exit 0; fi
            conclusion=$(gh api "repos/$REPO/actions/runs?branch=main&head_sha=$main_sha" \
              --jq '[.workflow_runs[] | select(.name=="CI")][0].conclusion // ""')
            case "$conclusion" in
              failure | cancelled | timed_out)
                echo "::error::main's pipeline for this code ended '$conclusion': nothing ships that has not passed it."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::No verified image for this code after 45 minutes."
          exit 1

  build:
    name: Build image (candidate)
    needs: plan
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.ref == 'refs/heads/production' && needs.plan.outputs.verified == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: echo "key=$(bash .github/content-key.sh HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Refuse a public or missing Docker Hub repository
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          # The owner's explicit, temporary override (a repository VARIABLE, so it is
          # visible): while it is `true` a public or missing repository is a WARNING on
          # every build instead of a refusal. Delete the variable once the repository
          # is private, and the guard is back.
          ALLOW_PUBLIC: ${{ vars.DOCKER_HUB_ALLOW_PUBLIC }}
          REPOSITORY: oxshare-crm-backend
        run: |
          set -euo pipefail
          repo="$DOCKER_USERNAME/$REPOSITORY"
          body() { jq -n --arg a "$1" --arg b "$2" --arg ka "$3" --arg kb "$4" '{($ka): $a, ($kb): $b}'; }
          jwt=$(curl -sS -H 'Content-Type: application/json' \
                  -d "$(body "$DOCKER_USERNAME" "$DOCKER_SECRET" identifier secret)" \
                  https://hub.docker.com/v2/auth/token | jq -r '.access_token // empty' || true)
          [ -n "$jwt" ] || jwt=$(curl -sS -H 'Content-Type: application/json' \
                  -d "$(body "$DOCKER_USERNAME" "$DOCKER_SECRET" username password)" \
                  https://hub.docker.com/v2/users/login | jq -r '.token // empty' || true)
          [ -n "$jwt" ] || { echo "::error::Could not sign in to Docker Hub's API to check that $repo is private."; exit 1; }
          private=$(curl -sS -H "Authorization: Bearer $jwt" "https://hub.docker.com/v2/repositories/$repo/" | jq -r '.is_private // "missing"')
          case "$private" in
            true) echo "$repo is private." ;;
            *)
              what=$([ "$private" = false ] && echo "is PUBLIC on Docker Hub: anyone can pull this image" || echo "does not exist yet, and a push creates it with the account's default visibility")
              if [ "$ALLOW_PUBLIC" = true ]; then
                echo "::warning::$repo $what. Allowed by the DOCKER_HUB_ALLOW_PUBLIC variable; make it private and delete that variable."
              else
                echo "::error::$repo $what. Create it PRIVATE (Repository -> Settings -> Visibility), then re-run."
                exit 1
              fi
              ;;
          esac

      # A CANDIDATE: nothing deploys `cand-*`. `promote` stamps it once verify passes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oxshare-crm-backend:cand-${{ steps.key.outputs.key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Promote the verified image
    needs: [verify, build]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      # A registry-side copy of the manifest: seconds, nothing rebuilt or re-pulled.
      - name: Stamp tree-<key> (and latest)
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/oxshare-crm-backend
          KEY: ${{ needs.build.outputs.key }}
        run: docker buildx imagetools create -t "$IMAGE:tree-$KEY" -t "$IMAGE:latest" "$IMAGE:cand-$KEY"

  deploy:
    name: Ship and deploy
    if: >-
      !cancelled() && github.ref == 'refs/heads/production' && github.event_name != 'pull_request' &&
      (needs.plan.outputs.verified == 'true' || needs.promote.result == 'success')
    needs: [plan, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deploy target on the VPS, relative to VPS_USER's home directory.
      DEPLOY_DIR: oxshare-crm-backend
    steps:
      # ── Fail on the runner, not in a crash loop on the VPS ────────────────
      #
      # env.validation.ts refuses to boot on any of these, which is correct and
      # also means the symptom is a container restarting forever behind a health
      # gate that times out twenty minutes later. Everything checkable is checked
      # here, where the error message can say which secret and why.
      - name: Validate secrets
        env:
          REQUIRED: |
            DOCKER_USERNAME DOCKER_SECRET VPS_HOST VPS_USER VPS_SSH_KEY_B64
            API_DOMAIN ACME_EMAIL POSTGRES_PASSWORD
            ADMIN_JWT_SECRET ADMIN_JWT_REFRESH_SECRET JWT_ACCESS_SECRET JWT_REFRESH_SECRET
            APP_ENCRYPTION_KEY PORTAL_URL ADMIN_URL
            MT5_BRIDGE_API_KEY MT5_BRIDGE_SECRET
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          get() { printf '%s' "$SECRETS_JSON" | jq -r --arg k "$1" '.[$k] // ""'; }
          fail() { echo "::error::$1"; FAILED=1; }
          FAILED=0

          missing=""
          for key in $REQUIRED; do
            [ -z "$(get "$key")" ] && missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            fail "Missing required GitHub secret(s):$missing"
          fi

          # Four DISTINCT secrets, each at least 32 characters. env.validation.ts
          # throws on a duplicate — reusing one across the admin and portal token
          # families means a token minted for one is valid for the other.
          for key in ADMIN_JWT_SECRET ADMIN_JWT_REFRESH_SECRET JWT_ACCESS_SECRET JWT_REFRESH_SECRET APP_ENCRYPTION_KEY; do
            v="$(get "$key")"
            [ -n "$v" ] && [ "${#v}" -lt 32 ] && fail "$key must be at least 32 characters (it is ${#v})."
          done
          dupes=$(for key in ADMIN_JWT_SECRET ADMIN_JWT_REFRESH_SECRET JWT_ACCESS_SECRET JWT_REFRESH_SECRET; do
                    get "$key"; done | sort | uniq -d | wc -l)
          [ "$dupes" -ne 0 ] && fail "The four JWT secrets must all be different from each other."

          # Both must be https, because session-cookies.ts derives `Secure` and the
          # `__Host-` prefix from them; and neither may end in a slash, because
          # realtime.gateway.ts compares them to the Origin header by exact string
          # equality and an Origin never carries one. z.string().url() accepts a
          # trailing slash, so nothing downstream would catch this — every
          # WebSocket handshake would just be refused, with a logger.warn as the
          # only trace.
          for key in PORTAL_URL ADMIN_URL; do
            v="$(get "$key")"
            case "$v" in
              https://*) ;;
              "") ;;
              *) fail "$key must start with https:// (it is '$v')." ;;
            esac
            case "$v" in */) fail "$key must not end with a slash (it is '$v')." ;; esac
          done

          # It is interpolated into DATABASE_URL, so anything outside the URL
          # unreserved set would have to be percent-encoded — and a `@` or `:`
          # would silently repoint the connection rather than fail. Generate it
          # with `openssl rand -hex 32`.
          pw="$(get POSTGRES_PASSWORD)"
          case "$pw" in
            *[!A-Za-z0-9._~-]*) fail "POSTGRES_PASSWORD must use only A-Z a-z 0-9 . _ ~ - so it is safe inside DATABASE_URL. Use: openssl rand -hex 32" ;;
          esac

          [ "$FAILED" -eq 1 ] && exit 1
          echo "All required secrets present and well-formed."

      - uses: actions/checkout@v4

      # Base64 as a single line so the key's newlines cannot be mangled on paste.
      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "PRIVATE KEY" \
            || { echo "::error::VPS_SSH_KEY_B64 did not decode to a private key"; exit 1; }

      # Shared runner IPs are intermittently dropped by edge DDoS scrubbing, which
      # looks identical to sshd being down. Poll rather than fail on the first
      # attempt; a sustained block still exits non-zero so a re-run draws a fresh IP.
      - name: Wait for the VPS to accept connections
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for i in $(seq 1 7); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "$HOST:$PORT reachable (attempt $i/7)"; exit 0
            fi
            echo "$HOST:$PORT unreachable (attempt $i/7); retrying in 8s"; sleep 8
          done
          echo "::error::$HOST:$PORT never became reachable. Re-run for a fresh runner IP."
          exit 1

      # ── Render .env on the runner. Never committed, never in the image. ────
      #
      # SINGLE-QUOTED, and that is not cosmetic. compose-go's dotenv parser
      # expands $VAR inside unquoted and double-quoted values, and takes an
      # unquoted `<` as the start of a variable name — a value like
      # `"Name" <a@b.c>` fails the WHOLE FILE to parse, losing every other
      # variable with it, not just its own line.
      #
      # A single quote inside a value cannot be escaped in dotenv syntax at all
      # (it is not a shell), so `put` refuses rather than emitting something that
      # would parse as the wrong value.
      - name: Render .env
        env:
          IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/oxshare-crm-backend
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_JWT_REFRESH_SECRET: ${{ secrets.ADMIN_JWT_REFRESH_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RIVAL_BASE_URL: ${{ secrets.RIVAL_BASE_URL }}
          RIVAL_API_KEY: ${{ secrets.RIVAL_API_KEY }}
          RIVAL_WEBHOOK_KEY: ${{ secrets.RIVAL_WEBHOOK_KEY }}
          MT5_BRIDGE_API_KEY: ${{ secrets.MT5_BRIDGE_API_KEY }}
          MT5_BRIDGE_SECRET: ${{ secrets.MT5_BRIDGE_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          IB_ACCRUAL_START: ${{ secrets.IB_ACCRUAL_START }}
          COMMISSION_MAX_PER_DEAL: ${{ secrets.COMMISSION_MAX_PER_DEAL }}
          COMMISSION_MAX_SHARE_OF_DEAL: ${{ secrets.COMMISSION_MAX_SHARE_OF_DEAL }}
          DB_POOL_MAX: ${{ secrets.DB_POOL_MAX }}
          MT5_BRIDGE_TIMEOUT_MS: ${{ secrets.MT5_BRIDGE_TIMEOUT_MS }}
          MT5_BRIDGE_READ_TIMEOUT_MS: ${{ secrets.MT5_BRIDGE_READ_TIMEOUT_MS }}
        run: |
          set -euo pipefail

          put() {
            local name="$1" value="${2-}"
            case "$value" in
              *"'"*) echo "::error::$name contains a single quote, which dotenv syntax cannot escape. Regenerate it without one."; exit 1 ;;
            esac
            if [ "$(printf '%s' "$value" | wc -l)" -ne 0 ]; then
              echo "::error::$name contains a newline."; exit 1
            fi
            printf "%s='%s'\n" "$name" "$value"
          }
          # Optional settings: an EMPTY value is not the same as an absent one.
          # `RIVAL_BASE_URL=''` fails zod's .url() and refuses the boot, where
          # leaving the key out entirely is a legal unconfigured state.
          put_optional() { [ -n "${2-}" ] && put "$1" "$2" || true; }

          {
            # Compose interpolation (docker-compose.prod.yml), not application config.
            put IMAGE_REPO "$IMAGE_REPO"
            # No IMAGE_TAG: each API colour's tag lives in release.env on the server,
            # written by deploy/release.sh, so re-rendering .env never moves the live version.
            put POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            put API_DOMAIN "$API_DOMAIN"
            put ACME_EMAIL "$ACME_EMAIL"

            put NODE_ENV production
            put PORT 3001
            # Explicit, not inherited: realtime-io.adapter.ts falls back to the
            # slower Node engine SILENTLY if uWS will not load, so the intent has
            # to be stated somewhere the deploy can assert against.
            put REALTIME_ENGINE uws
            put REALTIME_PORT 3003
            # Exactly one reverse proxy — Caddy, directly internet-facing. Raise
            # this to 2 if a CDN is ever put in front, or every request resolves
            # to the CDN's address for the rate limiter, the RBAC-08 allowlist
            # and the audit trail alike.
            put TRUSTED_PROXY_HOPS 1
            # Stated, never inferred: env.validation.ts refuses `disk` in
            # production outright, because a silent downgrade puts identity
            # documents on a container filesystem with nothing reporting it.
            put STORAGE_DRIVER r2
            put REDIS_URL redis://redis:6379
            put DATABASE_URL "postgresql://oxshare:${POSTGRES_PASSWORD}@postgres:5432/oxshare"
            put PORTAL_URL "$PORTAL_URL"
            put ADMIN_URL "$ADMIN_URL"
            put API_PUBLIC_URL "https://${API_DOMAIN}"

            put ADMIN_JWT_SECRET "$ADMIN_JWT_SECRET"
            put ADMIN_JWT_REFRESH_SECRET "$ADMIN_JWT_REFRESH_SECRET"
            put JWT_ACCESS_SECRET "$JWT_ACCESS_SECRET"
            put JWT_REFRESH_SECRET "$JWT_REFRESH_SECRET"
            put APP_ENCRYPTION_KEY "$APP_ENCRYPTION_KEY"

            put R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
            put R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
            put R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
            put R2_BUCKET "$R2_BUCKET"

            put_optional RIVAL_BASE_URL "${RIVAL_BASE_URL-}"
            put_optional RIVAL_API_KEY "${RIVAL_API_KEY-}"
            put_optional RIVAL_WEBHOOK_KEY "${RIVAL_WEBHOOK_KEY-}"

            # The MT5 bridge, over the WireGuard tunnel to the Contabo server. A
            # constant, like REDIS_URL: the address belongs to this server's
            # design (wg0 is 10.8.0.1, the bridge is 10.8.0.2), and port 5055 is
            # reachable only through the tunnel, never from the internet.
            put MT5_BRIDGE_URL http://10.8.0.2:5055
            put MT5_BRIDGE_API_KEY "$MT5_BRIDGE_API_KEY"
            put MT5_BRIDGE_SECRET "$MT5_BRIDGE_SECRET"
            put_optional MT5_BRIDGE_TIMEOUT_MS "${MT5_BRIDGE_TIMEOUT_MS-}"
            put_optional MT5_BRIDGE_READ_TIMEOUT_MS "${MT5_BRIDGE_READ_TIMEOUT_MS-}"

            # The portal assistant. Without a key it answers 503 and nothing else
            # changes. Use a DEDICATED OpenAI project with a monthly budget.
            put_optional OPENAI_API_KEY "${OPENAI_API_KEY-}"
            put_optional OPENAI_MODEL "${OPENAI_MODEL-}"

            # A COMMERCIAL decision, carried over from the current production .env,
            # never invented here: unset holds an aged commission backlog unpaid
            # (safe, and it alerts) until somebody decides. See CLAUDE.md
            # "The backlog is a DECISION".
            put_optional IB_ACCRUAL_START "${IB_ACCRUAL_START-}"
            put_optional COMMISSION_MAX_PER_DEAL "${COMMISSION_MAX_PER_DEAL-}"
            put_optional COMMISSION_MAX_SHARE_OF_DEAL "${COMMISSION_MAX_SHARE_OF_DEAL-}"
            put_optional DB_POOL_MAX "${DB_POOL_MAX-}"

            # NO SMTP_* HERE, DELIBERATELY. Mail is admin-configured on
            # Settings → Email and lives in the smtp_settings row; see the note
            # in src/config/env.validation.ts. Adding it back would put relay
            # credentials in two places, with this copy unused after the first save.
          } > .env.rendered

          echo "Rendered $(wc -l < .env.rendered) variables."

      - name: Ship and deploy
        env:
          IMAGE_TAG: tree-${{ needs.plan.outputs.key }}
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          # Optional. Set both and every deploy guarantees the first
          # administrator exists — which is what makes rebuilding this VPS, or
          # moving to a different one, a pure `git push`. Omit them and the
          # bootstrap step says so and skips. Not in REQUIRED above for that
          # reason. The password must be at least 12 characters; the script
          # refuses shorter ones rather than putting a guessable credential on
          # the only account that holds every permission.
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEY=~/.ssh/deploy_key
          COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          ssh -i "$KEY" -p "$PORT" $COMMON "$SSH_USER@$HOST" "mkdir -p $DEPLOY_DIR"

          scp -i "$KEY" -P "$PORT" $COMMON \
            docker-compose.prod.yml Caddyfile deploy/release.sh .env.rendered \
            "$SSH_USER@$HOST:$DEPLOY_DIR/"

          # DOCKER_SECRET goes over STDIN, not the ssh argv — argv is world-readable
          # through `ps` on the VPS for the length of the deploy.
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          mv -f .env.rendered .env
          chmod 600 .env

          echo "$DOCKER_SECRET" | docker login -u "$DOCKER_USERNAME" --password-stdin
          # Zero downtime: the new version starts BESIDE the live one, Caddy switches
          # only once it is healthy, and the old one drains. A release that never
          # becomes healthy is stopped and the live version carries on. Rollback:
          # `bash release.sh rollback` on the server. See deploy/release.sh.
          export BOOTSTRAP_ADMIN_EMAIL BOOTSTRAP_ADMIN_PASSWORD
          bash release.sh deploy "$IMAGE_TAG"
          docker logout >/dev/null 2>&1 || true
          bash release.sh status
          REMOTE
          )"
          # Secrets go over STDIN with %q quoting, never the ssh argv — argv is
          # world-readable through `ps` on the VPS for as long as the deploy runs.
          # The admin password rides the same channel as the registry password
          # for exactly that reason.
          {
            printf 'DOCKER_SECRET=%q\n' "$DOCKER_SECRET"
            printf 'IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'BOOTSTRAP_ADMIN_EMAIL=%q\n' "${BOOTSTRAP_ADMIN_EMAIL:-}"
            printf 'BOOTSTRAP_ADMIN_PASSWORD=%q\n' "${BOOTSTRAP_ADMIN_PASSWORD:-}"
            printf '%s\n' "$REMOTE_SCRIPT"
          } | \
            ssh -i "$KEY" -p "$PORT" $COMMON "$SSH_USER@$HOST" \
              "DEPLOY_DIR='$DEPLOY_DIR' DOCKER_USERNAME='$DOCKER_USERNAME' bash -s"
