# TO RE-ENABLE:
#   1. Uncomment everything below this banner.
#   2. Repoint the secrets at the new host: VPS_HOST, VPS_USER, VPS_SSH_KEY_B64.
#   3. Confirm the target runs Docker + Compose and that the `deploy` user can
