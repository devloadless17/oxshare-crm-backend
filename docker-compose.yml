# Local development infrastructure.
#   docker compose up -d        start
#   docker compose down         stop (data kept)
#   docker compose down -v      stop + wipe data (fresh database)
#
# Dev runs against this local Postgres. Tests use
# Testcontainers (ARCHITECTURE §2/§11) and manage their own containers.
services:
  postgres:
    image: postgres:16-alpine
    container_name: oxshare-postgres
    environment:
      POSTGRES_USER: oxshare
      POSTGRES_PASSWORD: oxshare_dev
      POSTGRES_DB: oxshare
    ports:
      - '5432:5432'
    volumes:
      - oxshare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oxshare -d oxshare']
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-use replay markers for signed webhooks (§8.4, R-5.3). Short-lived
  # keys with a TTL — the one job Redis does natively and Postgres does badly.
  # No volume: every key here is meant to expire in minutes, so persisting them
  # across a restart would be worse than losing them.
  redis:
    image: redis:7-alpine
    container_name: oxshare-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mail catcher for the end-to-end suites and local development. Every email
  # the API sends (verification links, password resets, invites, KYC decisions)
  # lands here instead of a real inbox; the UI is http://localhost:8025 and the
  # suites read it over its REST API. Point Settings → Email (or let
  # global-setup do it with E2E_CONFIGURE_MAILPIT=1) at host localhost:1025.
  # No volume: a mailbox of test tokens should not survive a restart.
  mailpit:
    image: axllent/mailpit
    container_name: oxshare-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  oxshare_pgdata:
