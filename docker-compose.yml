# Local development infrastructure.
#   docker compose up -d        start
#   docker compose down         stop (data kept)
#   docker compose down -v      stop + wipe data (fresh database)
#
# Dev runs against this local Postgres; the shared Neon instance is
# staging/demo only (its URL stays commented in .env). Tests use
# Testcontainers (ARCHITECTURE §2/§11) and manage their own containers.
services:
  postgres:
    image: postgres:16-alpine
    container_name: oxshare-postgres
    environment:
      POSTGRES_USER: oxshare
      POSTGRES_PASSWORD: oxshare_dev
      POSTGRES_DB: oxshare
    ports:
      - '5432:5432'
    volumes:
      - oxshare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oxshare -d oxshare']
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-use replay markers for signed webhooks (§8.4, R-5.3). Short-lived
  # keys with a TTL — the one job Redis does natively and Postgres does badly.
  # No volume: every key here is meant to expire in minutes, so persisting them
  # across a restart would be worse than losing them.
  redis:
    image: redis:7-alpine
    container_name: oxshare-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oxshare_pgdata:
